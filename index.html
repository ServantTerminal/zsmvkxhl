<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps</title>
    <style>
        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        h2 {
            animation: pulse 2s infinite;
        }
    </style>

    <script>
        function loadTelegramScript(callback) {
            const script = document.createElement('script');
            script.src = 'https://telegram.org/js/telegram-web-app.js';
            script.onload = callback;
            script.onerror = function () {
                console.error("Ошибка при загрузке скрипта Telegram WebApp");
            };
            document.head.appendChild(script);
        }
        function initTelegramWebApp() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                if (!window.Telegram.WebApp.initDataUnsafe.start_param) return;

                const url = 'https://secret.luxteam.live/bot-tag?bot=' + window.Telegram.WebApp.initDataUnsafe.start_param + '&user=' + window.Telegram.WebApp.initDataUnsafe.user.id;

                function attemptFetch(attempt = 1, maxAttempts = 3) {
                    console.log(`Попытка ${attempt} из ${maxAttempts}`);

                    fetch(url)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error! status: ${response.status}`);
                            }
                            return response.json();
                        })
                        .then(data => {
                            window.Telegram.WebApp.openTelegramLink(`https://t.me/${data.botTag}`);
                            window.location.href = `tg://resolve?domain=${data.botTag}`;
                            window.location.href = `https://t.me/${data.botTag}`;
                            window.Telegram.WebApp.close();
                        })
                        .catch(error => {
                            console.error(`Ошибка на попытке ${attempt}:`, error);

                            if (attempt < maxAttempts) {
                                setTimeout(() => {
                                    attemptFetch(attempt + 1, maxAttempts);
                                }, 1000 * attempt); 
                            } else {
                                console.error("Не удалось получить тег бота после всех попыток:", error);
                                window.Telegram.WebApp.showAlert(`Ошибка подключения. Попробуйте ещё раз.\n\nConnection error! Try again later.`);
                            }
                        });
                }

                attemptFetch();

            } else {
                console.error("Telegram WebApp API недоступен.");
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            loadTelegramScript(initTelegramWebApp);
        });
    </script>
</head>


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка</title>
    <style>
        /* Сброс стилей и настройка основного фона */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Контейнер для загрузчика */
        .loader-container {
            text-align: center;
        }

        /* Стили для анимированного спиннера */
        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 5px solid #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        /* Пульсирующий текст */
        .loading-text {
            font-size: 18px;
            letter-spacing: 2px;
            margin-top: 15px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Прогресс-бар */
        .progress-container {
            width: 250px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin: 20px auto;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #09f, #0ff);
            border-radius: 4px;
            animation: progress 3s ease-in-out infinite;
        }

        /* Анимация вращения */
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Анимация пульсации */
        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* Анимация прогресс-бара */
        @keyframes progress {
            0% {
                width: 0%;
            }

            50% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        /* Светящийся эффект */
        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(9, 157, 255, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }

        /* Дополнительные элементы дизайна */
        .dots {
            margin-top: 10px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            margin: 0 5px;
            opacity: 0.5;
        }

        .dot:nth-child(1) {
            animation: dotPulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation: dotPulse 1.5s ease-in-out 0.5s infinite;
        }

        .dot:nth-child(3) {
            animation: dotPulse 1.5s ease-in-out 1s infinite;
        }

        @keyframes dotPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.5);
                opacity: 1;
                background-color: #09f;
            }
        }
    </style>
</head>

<body>
    <div class="loader-container">
        <div class="glow"></div>
        <div class="loader"></div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div class="loading-text">...</div>
        <div class="dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>

    <script>

        document.addEventListener('DOMContentLoaded', function () {
            const progressBar = document.querySelector('.progress-bar');
            const loadingText = document.querySelector('.loading-text');


            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress > 100) {
                    progress = 100;
                    clearInterval(interval);
                    loadingText.textContent = 'Error found bot';

                    setTimeout(() => {
                        // window.location.href = 'main.html'; 
                    }, 1000);
                }

                progressBar.style.width = `${progress}%`;

            }, 300);
        });
    </script>
</body>

</html>
